<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Platform layers from hardware to applications: Vera Rubin racks run bare metal provisioned by Mission Control or open tooling; the application plane runs on separate CPU racks, bare metal or hypervisor; Slurm can optionally run on Kubernetes"><defs></defs><rect x="0" y="0" width="1280" height="860" rx="12" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">The software layers, and the three decisions inside them</text><text x="40" y="80" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Who provisions the racks, where a hypervisor can sit, and where Slurm can sit.</text><text x="485" y="116" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Vera Rubin NVL72 racks</text><text x="1015" y="116" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Separate CPU racks (application plane)</text><text x="40" y="163.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Applications</text><rect x="200" y="130" width="1040" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="720.0" y="163.0" font-size="14" font-weight="normal" fill="#065f46" text-anchor="middle">Chat · coding and research agents · document pipelines · domain assistants</text><text x="40" y="244.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Workloads</text><rect x="200" y="200" width="570" height="78" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="485.0" y="234.5" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Training — PyTorch · Megatron-LM · DeepSpeed · KubeRay · Kubeflow</text><text x="485.0" y="253.5" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Serving — KServe · vLLM / SGLang · llm-d / Dynamo · LeaderWorkerSet</text><rect x="790" y="200" width="450" height="78" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="1015.0" y="234.5" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Gateways · auth · vector databases</text><text x="1015.0" y="253.5" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Observability — Prometheus · Grafana</text><text x="40" y="345.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Scheduling</text><rect x="200" y="292" width="330" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="365.0" y="326.0" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Kubernetes-native batch</text><text x="365.0" y="345.0" font-size="13" font-weight="normal" fill="#5b21b6" text-anchor="middle">Kueue · KAI · Volcano</text><text x="365.0" y="364.0" font-size="13" font-weight="normal" fill="#5b21b6" text-anchor="middle">gang + topology-aware</text><rect x="545" y="292" width="225" height="96" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 5"/><text x="657.5" y="326.0" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Slurm on Kubernetes</text><text x="657.5" y="345.0" font-size="13" font-weight="normal" fill="#5b21b6" text-anchor="middle">Slinky · SUNK</text><text x="657.5" y="364.0" font-size="13" font-weight="normal" fill="#5b21b6" text-anchor="middle">researchers keep sbatch</text><rect x="555" y="282" width="65" height="19" rx="9.5" fill="#7c3aed"/><text x="587.5" y="294" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">OPTIONAL</text><rect x="790" y="292" width="450" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="335.5" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Default kube-scheduler</text><text x="1015.0" y="354.5" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">stateless services</text><text x="40" y="442.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Operators</text><rect x="200" y="402" width="570" height="70" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="485.0" y="432.5" font-size="13" font-weight="normal" fill="#0f766e" text-anchor="middle">GPU Operator · DRA driver (ComputeDomains, IMEX)</text><text x="485.0" y="451.5" font-size="13" font-weight="normal" fill="#0f766e" text-anchor="middle">Network Operator · Multus · SR-IOV · Topograph</text><rect x="790" y="402" width="450" height="70" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="1015.0" y="432.5" font-size="13" font-weight="normal" fill="#0f766e" text-anchor="middle">CSI storage drivers</text><text x="1015.0" y="451.5" font-size="13" font-weight="normal" fill="#0f766e" text-anchor="middle">standard Kubernetes add-ons</text><text x="40" y="519.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Kubernetes</text><rect x="200" y="486" width="1040" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="720.0" y="519.0" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="middle">Kubernetes 1.34+ · primary CNI (Cilium, Calico, OVN-Kubernetes) · one cluster or a federated pair</text><text x="40" y="604.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Host</text><rect x="200" y="556" width="570" height="86" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/><text x="485.0" y="585.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Bare metal — required</text><text x="485.0" y="604.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">NVAIE support and clique / ComputeDomain discovery</text><text x="485.0" y="623.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">assume the Kubernetes node is the physical node</text><rect x="790" y="556" width="138" height="86" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="859.0" y="594.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Bare metal</text><text x="859.0" y="613.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">simplest path</text><text x="942" y="604.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">or</text><rect x="955" y="556" width="285" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1097.5" y="585.0" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Hypervisor</text><text x="1097.5" y="604.0" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">vSphere · KubeVirt · AHV · Harvester</text><text x="1097.5" y="623.0" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">reuse VI skills · split 4-socket hosts</text><rect x="965" y="546" width="65" height="19" rx="9.5" fill="#d97706"/><text x="997.5" y="558" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DECISION</text><text x="40" y="699.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Provisioning</text><rect x="200" y="656" width="255" height="76" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/><text x="327.5" y="680.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">NVIDIA Mission Control</text><text x="327.5" y="699.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Base Command Manager</text><text x="327.5" y="718.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">proprietary</text><text x="467" y="699.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">or</text><rect x="480" y="656" width="290" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="625.0" y="680.0" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Open tooling</text><text x="625.0" y="699.0" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">Metal3 · Tinkerbell</text><text x="625.0" y="718.0" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">+ own firmware automation</text><rect x="490" y="646" width="65" height="19" rx="9.5" fill="#d97706"/><text x="522.5" y="658" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DECISION</text><rect x="790" y="656" width="450" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="689.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Existing server provisioning</text><text x="1015.0" y="708.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">or vCenter, if virtualized</text><text x="40" y="791.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Hardware</text><rect x="200" y="746" width="570" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="485.0" y="772.0" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">NVL72 racks — 72 GPUs, one NVLink domain each</text><text x="485.0" y="791.0" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">NVLink switch software (NVOS, NMX) is NVIDIA's either way</text><text x="485.0" y="810.0" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">ConnectX-9 scale-out · storage via BlueField-4</text><rect x="790" y="746" width="450" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="781.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">General-purpose CPU servers</text><text x="1015.0" y="800.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">in their own racks, not in the Vera Rubin racks</text><text x="640" y="848" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Dashed = a decision, not a requirement. Below rack scale (8-GPU HGX, PCIe GPUs), the hypervisor option opens on the GPU side too — see Part 3.</text></svg>
