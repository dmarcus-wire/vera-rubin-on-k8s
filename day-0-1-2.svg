<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Day 0 before the racks arrive, day 1 bring-up and validation, day 2 operations"><defs><marker id="h94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="hdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="1280" height="600" rx="12" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Operational on day one</text><text x="40" y="80" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Build and prove the platform before the racks arrive, so delivery day is bring-up and validation.</text><rect x="40" y="110" width="440" height="410" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><rect x="58" y="128" width="53" height="21" rx="10.5" fill="#6366f1"/><text x="84.5" y="142" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DAY 0</text><text x="123" y="142" font-size="17" font-weight="700" fill="#3730a3" text-anchor="start">Before the racks arrive</text><rect x="62" y="183" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="196" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Facility: power, 100% liquid cooling</text><rect x="62" y="229" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="242" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Network designed, switch configs as code</text><rect x="62" y="275" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="288" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Kubernetes and application racks running</text><rect x="62" y="321" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="334" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Platform tested on existing GPU nodes</text><rect x="62" y="367" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="380" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Model weights and first datasets staged</text><rect x="62" y="413" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="426" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Acceptance criteria agreed with the vendor</text><rect x="62" y="459" width="16" height="16" rx="3" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/><text x="92" y="472" font-size="14" font-weight="normal" fill="#3730a3" text-anchor="start">Provisioning path chosen: BCM or open tooling</text><rect x="530" y="110" width="340" height="410" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><rect x="548" y="128" width="53" height="21" rx="10.5" fill="#10b981"/><text x="574.5" y="142" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DAY 1</text><text x="613" y="142" font-size="17" font-weight="700" fill="#065f46" text-anchor="start">The racks land</text><circle cx="560" cy="191" r="11" fill="#10b981"/><text x="560" y="196" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="582" y="196" font-size="14" font-weight="normal" fill="#065f46" text-anchor="start">Power on and provision the racks</text><circle cx="560" cy="237" r="11" fill="#10b981"/><text x="560" y="242" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="582" y="242" font-size="14" font-weight="normal" fill="#065f46" text-anchor="start">One firmware version across the rack</text><circle cx="560" cy="283" r="11" fill="#10b981"/><text x="560" y="288" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="582" y="288" font-size="14" font-weight="normal" fill="#065f46" text-anchor="start">NVLink fabric up (NMX)</text><circle cx="560" cy="329" r="11" fill="#10b981"/><text x="560" y="334" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="582" y="334" font-size="14" font-weight="normal" fill="#065f46" text-anchor="start">DCGM → nvbandwidth → NCCL → burn-in</text><circle cx="560" cy="375" r="11" fill="#10b981"/><text x="560" y="380" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="582" y="380" font-size="14" font-weight="normal" fill="#065f46" text-anchor="start">Join the Kubernetes cluster</text><circle cx="560" cy="421" r="11" fill="#10b981"/><text x="560" y="426" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="582" y="426" font-size="14" font-weight="normal" fill="#065f46" text-anchor="start">Rerun the Day 0 workloads</text><rect x="890" y="110" width="350" height="410" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect x="908" y="128" width="53" height="21" rx="10.5" fill="#475569"/><text x="934.5" y="142" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DAY 2</text><text x="973" y="142" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Operate 24/7</text><circle cx="920" cy="191" r="5" fill="#475569"/><text x="942" y="196" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Training backfills idle inference GPUs</text><circle cx="920" cy="237" r="5" fill="#475569"/><text x="942" y="242" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Health checks; replace failing trays</text><circle cx="920" cy="283" r="5" fill="#475569"/><text x="942" y="288" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Rolling upgrades, one rack at a time</text><circle cx="920" cy="329" r="5" fill="#475569"/><text x="942" y="334" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Chargeback feeds the next sizing round</text><line x1="505" y1="104" x2="505" y2="528" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="505" y="548" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Racks hit the floor</text><line x1="872" y1="315" x2="888" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#h94a3b8)"/><text x="640" y="585" font-size="15" font-weight="normal" fill="#475569" text-anchor="middle">Day 0 decides the schedule: every week a delivered rack waits on the platform is capital earning nothing.</text></svg>
