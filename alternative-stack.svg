<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Best non-NVIDIA fit: AMD Helios or MI355X servers on the same Kubernetes platform, showing which layers stay the same, which components are swapped, which are decisions, and the rack-domain topology gap"><defs></defs><rect x="0" y="0" width="1280" height="990" rx="12" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">The best non-NVIDIA fit, on the same Kubernetes platform</text><text x="40" y="80" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Everything from Kubernetes up carries over. The GPU runtime, collective library, operators, and fabrics swap.</text><rect x="40" y="102" width="26" height="16" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="74" y="115" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="start">Same as the NVIDIA design</text><rect x="284" y="102" width="26" height="16" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="318" y="115" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="start">Swapped component</text><rect x="470" y="102" width="26" height="16" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="504" y="115" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="start">Decision</text><rect x="591" y="102" width="26" height="16" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="625" y="115" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="start">Known gap: verify</text><text x="485" y="148" font-size="15" font-weight="700" fill="#9f1239" text-anchor="middle">AMD GPU racks</text><text x="1015" y="148" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Separate CPU racks (application plane)</text><text x="40" y="190.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Applications</text><rect x="200" y="162" width="1040" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="720.0" y="190.0" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle">Chat · coding and research agents · document pipelines · domain assistants</text><text x="40" y="258.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Workloads</text><rect x="200" y="220" width="570" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="485.0" y="248.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Training — PyTorch · Megatron-LM · DeepSpeed (ROCm builds)</text><text x="485.0" y="267.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Serving — KServe · vLLM · SGLang (upstream ROCm support)</text><rect x="790" y="220" width="450" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="248.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Gateways · auth · vector databases</text><text x="1015.0" y="267.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Observability — Prometheus · Grafana</text><text x="40" y="343.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Scheduling</text><rect x="200" y="300" width="330" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="365.0" y="324.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Kubernetes-native batch</text><text x="365.0" y="343.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Kueue · Volcano</text><text x="365.0" y="362.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">gang + topology-aware</text><rect x="545" y="300" width="225" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="657.5" y="324.0" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Slurm on Kubernetes</text><text x="657.5" y="343.0" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">Slinky</text><text x="657.5" y="362.0" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">researchers keep sbatch</text><rect x="555" y="290" width="65" height="19" rx="9.5" fill="#d97706"/><text x="587.5" y="302" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">OPTIONAL</text><rect x="790" y="300" width="450" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="343.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Default kube-scheduler</text><text x="40" y="428.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Topology</text><rect x="200" y="392" width="570" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="485.0" y="418.5" font-size="13" font-weight="normal" fill="#991b1b" text-anchor="middle">Rack-domain placement: Kueue topology-aware scheduling on rack labels</text><text x="485.0" y="437.5" font-size="13" font-weight="normal" fill="#991b1b" text-anchor="middle">No published AMD equivalent of ComputeDomains yet</text><rect x="210" y="382" width="53" height="19" rx="9.5" fill="#dc2626"/><text x="236.5" y="394" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFY</text><text x="40" y="508.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">GPU software</text><rect x="200" y="470" width="570" height="66" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="485.0" y="498.5" font-size="13" font-weight="normal" fill="#9f1239" text-anchor="middle">ROCm (open source) replaces CUDA · RCCL replaces NCCL</text><text x="485.0" y="517.5" font-size="13" font-weight="normal" fill="#9f1239" text-anchor="middle">AMD GPU Operator · AMD GPU DRA driver · Device Metrics Exporter</text><rect x="790" y="470" width="450" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="498.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">CSI storage drivers</text><text x="1015.0" y="517.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">standard Kubernetes add-ons</text><text x="40" y="578.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Kubernetes</text><rect x="200" y="550" width="1040" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="720.0" y="578.0" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle">Kubernetes 1.34+ · primary CNI · Multus + SR-IOV for RDMA — all unchanged</text><text x="40" y="646.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Host</text><rect x="200" y="610" width="570" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="485.0" y="636.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Bare metal</text><text x="485.0" y="655.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">recommended for the rack-scale domain, as on NVL72</text><rect x="790" y="610" width="450" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1015.0" y="636.5" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Bare metal or hypervisor</text><text x="1015.0" y="655.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">vSphere · KubeVirt · AHV · Harvester</text><rect x="800" y="600" width="65" height="19" rx="9.5" fill="#d97706"/><text x="832.5" y="612" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DECISION</text><text x="40" y="722.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Provisioning</text><rect x="200" y="686" width="570" height="62" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="485.0" y="712.5" font-size="13" font-weight="normal" fill="#9f1239" text-anchor="middle">Open tooling: Metal3 · Tinkerbell · OEM rack tools</text><text x="485.0" y="731.5" font-size="13" font-weight="normal" fill="#9f1239" text-anchor="middle">no NVIDIA Mission Control license in the path</text><rect x="790" y="686" width="450" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="722.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Existing server provisioning</text><text x="40" y="821.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">GPU hardware</text><rect x="200" y="766" width="280" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="340.0" y="792.5" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">AMD Helios rack</text><text x="340.0" y="811.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">72 MI455X · 432 GB HBM4 each</text><text x="340.0" y="830.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">UALink over Ethernet,</text><text x="340.0" y="849.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">~3.6 TB/s per GPU · H2 2026</text><rect x="210" y="756" width="65" height="19" rx="9.5" fill="#d97706"/><text x="242.5" y="768" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DECISION</text><text x="492" y="821.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">or</text><rect x="505" y="766" width="265" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="637.5" y="792.5" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">MI355X 8-GPU servers</text><text x="637.5" y="811.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">288 GB HBM3E each</text><text x="637.5" y="830.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">Infinity Fabric in the server</text><text x="637.5" y="849.5" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">shipping today</text><rect x="790" y="766" width="450" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="811.5" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">General-purpose CPU servers</text><text x="1015.0" y="830.5" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">in their own racks</text><text x="40" y="913.0" font-size="14" font-weight="700" fill="#475569" text-anchor="start">Scale-out</text><rect x="200" y="880" width="570" height="56" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="485.0" y="903.5" font-size="13" font-weight="normal" fill="#9f1239" text-anchor="middle">Ultra Ethernet — Pensando Pollara 400 / Vulcano 800G NICs</text><text x="485.0" y="922.5" font-size="13" font-weight="normal" fill="#9f1239" text-anchor="middle">Arista or Broadcom-based switches</text><rect x="790" y="880" width="450" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="1015.0" y="913.0" font-size="13" font-weight="normal" fill="#0f172a" text-anchor="middle">Standard data center Ethernet</text><text x="640" y="970" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">The pattern carries over; the silicon, fabrics, and vendor software swap. The gap to close first is rack-domain topology awareness in Kubernetes.</text></svg>
