<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="From design to day-one operational: hardware design, software platform, and alternatives happen before the racks arrive; day 1 is bring-up and validation; day 2 is operating 24/7"><defs><marker id="h94a3b8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="hdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="1280" height="500" rx="12" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">From design to day-one operational</text><text x="40" y="80" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Why customers buy: contain hosted-API spend and protect the data moat. How they get there:</text><rect x="40" y="108" width="730" height="292" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="56" y="130" font-size="12" font-weight="700" fill="#475569" text-anchor="start">DAY 0 · BEFORE THE RACKS ARRIVE</text><rect x="60" y="160" width="210" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="74" y="174" width="56" height="20" rx="10.0" fill="#2563eb"/><text x="102.0" y="187" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PART 1</text><text x="165" y="230" font-size="19" font-weight="700" fill="#1e3a8a" text-anchor="middle">Hardware design</text><text x="165" y="270" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Compute · network · storage</text><text x="165" y="292" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">NVLink stops at the rack</text><text x="165" y="314" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Parallelism is designed</text><text x="165" y="336" font-size="13" font-weight="normal" fill="#1e3a8a" text-anchor="middle">around that boundary</text><rect x="300" y="160" width="210" height="210" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><rect x="314" y="174" width="56" height="20" rx="10.0" fill="#6366f1"/><text x="342.0" y="187" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PART 2</text><text x="405" y="230" font-size="19" font-weight="700" fill="#3730a3" text-anchor="middle">Software platform</text><text x="405" y="270" font-size="13" font-weight="normal" fill="#3730a3" text-anchor="middle">Orchestrator, hypervisor,</text><text x="405" y="292" font-size="13" font-weight="normal" fill="#3730a3" text-anchor="middle">and Slurm decisions</text><text x="405" y="314" font-size="13" font-weight="normal" fill="#3730a3" text-anchor="middle">Scheduling · serving</text><text x="405" y="336" font-size="13" font-weight="normal" fill="#3730a3" text-anchor="middle">Resilience · 24/7 use</text><rect x="540" y="160" width="210" height="210" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/><rect x="554" y="174" width="138" height="20" rx="10.0" fill="#d97706"/><text x="623.0" y="187" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PART 3 · IF NEEDED</text><text x="645" y="230" font-size="19" font-weight="700" fill="#92400e" text-anchor="middle">Alternatives</text><text x="645" y="270" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">If Rubin isn't the fit:</text><text x="645" y="292" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">GB300, HGX, AMD</text><text x="645" y="314" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">The platform pattern</text><text x="645" y="336" font-size="13" font-weight="normal" fill="#92400e" text-anchor="middle">carries over</text><line x1="272" y1="265" x2="296" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#h94a3b8)"/><line x1="512" y1="265" x2="536" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#h94a3b8)"/><line x1="800" y1="104" x2="800" y2="412" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="800" y="98" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Racks hit the floor</text><line x1="752" y1="265" x2="826" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#h94a3b8)"/><rect x="830" y="160" width="190" height="210" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><rect x="844" y="174" width="111" height="20" rx="10.0" fill="#10b981"/><text x="899.5" y="187" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PART 4 · DAY 1</text><text x="925.0" y="230" font-size="19" font-weight="700" fill="#065f46" text-anchor="middle">Bring-up</text><text x="925.0" y="270" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Provision · firmware</text><text x="925.0" y="292" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">NVLink fabric up</text><text x="925.0" y="314" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">DCGM · NCCL · burn-in</text><text x="925.0" y="336" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Join the cluster</text><rect x="1045" y="160" width="195" height="210" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><rect x="1059" y="174" width="111" height="20" rx="10.0" fill="#10b981"/><text x="1114.5" y="187" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PART 4 · DAY 2</text><text x="1142.5" y="230" font-size="19" font-weight="700" fill="#065f46" text-anchor="middle">Operate 24/7</text><text x="1142.5" y="270" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Priority queues</text><text x="1142.5" y="292" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Health · drain · replace</text><text x="1142.5" y="314" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Rolling upgrades</text><text x="1142.5" y="336" font-size="13" font-weight="normal" fill="#065f46" text-anchor="middle">Chargeback</text><line x1="1022" y1="265" x2="1041" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#h94a3b8)"/><text x="640" y="448" font-size="15" font-weight="normal" fill="#475569" text-anchor="middle">Most of the work happens before delivery. If the platform is built and tested on Day 0,</text><text x="640" y="470" font-size="15" font-weight="normal" fill="#475569" text-anchor="middle">the day the racks land is bring-up and validation, not design.</text></svg>
